# Handed from fix-issue to a reviewer agent (its own Hermes profile and key):
# read one pull request and leave review comments. Issued with --from, so it
# can only be narrower than fix-issue's warrant.
version: 2
name: review-pr-57
ttl: 30m
capabilities:
  mcp__github__pull_request_read:
    method: [get, get_diff, get_files]
    owner: your-org
    repo: your-repo
    pullNumber: "57..57"                  # EDIT: the PR fix-issue opened
  mcp__github__pull_request_review_write:
    method: create
    event: COMMENT
    owner: your-org
    repo: your-repo
    pullNumber: "57..57"
    body: any
