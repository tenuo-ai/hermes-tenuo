# What your house-sitter may ask Hermes to do, for their stay. Attach it to
# their messaging ID (e.g. telegram:<their user ID>), not a session.
version: 2
name: house-sitter
ttl: 7d                                   # EDIT: the length of their stay
capabilities:
  ha_list_entities:
    domain: {optional: [light, scene, climate]}
  ha_get_state:
    entity_id: [climate.guest_room, light.guest_room, binary_sensor.front_door]   # EDIT
  ha_call_service:
    domain: [light, scene]
    service: [turn_on, turn_off]
    entity_id: [light.guest_room, scene.guest_room_comfort]                     # EDIT
