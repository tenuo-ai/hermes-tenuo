name: hermes-tenuo
version: 0.4.0
description: >
  Signed, expiring tool permissions and local workspaces for Hermes Agent.
  Tenuo warrants control which tools and arguments each task can use, including
  delegated agents. Hands lets your remote Hermes work in a folder on your Mac
  or Linux machine while memory and skills stay on the server. Use either feature
  independently or together.
author: Tenuo AI
license: Apache-2.0
homepage: https://github.com/tenuo-ai/hermes-tenuo
kind: standalone
# `hermes plugins enable` installs these into the Hermes runtime, after consent.
python_dependencies:
  - "path-jail>=0.3,<0.4"
  - "tenuo>=0.3.6,<0.4"
requires_hermes: ">=0.20"
tags: [authorization, warrants, hands, remote, workspace, sandbox, tenuo]
provides_tools:
  - tenuo_delegate
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_start
  - pre_llm_call
  - pre_gateway_dispatch
requires_env:
  - name: TENUO_WARRANT
    description: "Base64-encoded warrant or path to a .warrant file. Required to activate enforcement (or set plugins.entries.hermes-tenuo.warrant)."
    required: false
  - name: TENUO_SIGNING_KEY
    description: "Base64-encoded Ed25519 signing key matching the warrant holder (proof-of-possession)."
    required: false
  - name: TENUO_TRUSTED_ROOT
    description: "Base64-encoded public key of the warrant issuer. Required to enforce; without it every tool call is blocked (or set plugins.entries.hermes-tenuo.trusted_root)."
    required: false
