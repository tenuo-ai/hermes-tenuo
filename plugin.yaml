name: hermes-tenuo
version: 0.1.0
description: >
  Warrant-based authorization for Hermes Agent tool calls.
  Every tool call is checked against a signed, expiring warrant before it
  runs; argument constraints included. Optional Tenuo Cloud connection.
author: Tenuo AI
kind: standalone
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_start
requires_env:
  - name: TENUO_WARRANT
    description: "Base64-encoded warrant or path to a .warrant file. Required to activate enforcement (or set plugins.entries.hermes-tenuo.warrant)."
    required: false
  - name: TENUO_SIGNING_KEY
    description: "Base64-encoded Ed25519 signing key matching the warrant holder (proof-of-possession)."
    required: false
  - name: TENUO_CONNECT_TOKEN
    description: "Optional Tenuo Cloud connect token for audit streaming and Cloud-issued warrants."
    required: false
