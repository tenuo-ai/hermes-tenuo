name: hermes-tenuo
version: 0.4.2
description: >
  Give Hermes rules it can't simply ignore. Enforce hard limits on tool calls
  and their arguments, keep sensitive actions off the table, and give subagents
  and Kanban workers only the permissions their task needs, with signed,
  expiring Tenuo warrants checked before each call. Also includes Hands, which
  lets your remote Hermes work in a folder on your Mac or Linux machine.
author: Tenuo AI
license: Apache-2.0
homepage: https://github.com/tenuo-ai/hermes-tenuo
kind: standalone
# `hermes plugins enable` installs these into the Hermes runtime, after consent.
python_dependencies:
  - "path-jail>=0.3,<0.4"
  - "tenuo>=0.3.8,<0.4"
requires_hermes: ">=0.20"
tags: [security, permissions, guardrails, authorization, delegation, warrants, hands, workspace, sandbox, tenuo]
provides_tools:
  - tenuo_delegate
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_start
  - pre_llm_call
  - pre_gateway_dispatch
# Registered only when Hands (hands.listen) or mcp_proofs.servers is configured.
provides_middleware:
  - tool_execution
requires_env:
  - name: TENUO_WARRANT
    description: "Base64-encoded warrant or path to a .warrant file. Required to activate enforcement (or set plugins.entries.hermes-tenuo.warrant)."
    required: false
  - name: TENUO_SIGNING_KEY
    description: "Base64-encoded Ed25519 signing key matching the warrant holder (proof-of-possession)."
    required: false
  - name: TENUO_TRUSTED_ROOT
    description: "Base64-encoded public key of the warrant issuer. Required to enforce; without it every tool call is blocked (or set plugins.entries.hermes-tenuo.trusted_root)."
    required: false
