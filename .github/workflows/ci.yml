name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Lint
        run: python -m ruff check
      - name: Install bubblewrap (the Hands sandbox on Linux)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check out previous Hands protocol implementation
        uses: actions/checkout@v7
        with:
          ref: 96becacc21da39566799ea723c788984f54bbb9c
          path: .hands-compat-baseline
      - name: Run tests
        env:
          HANDS_COMPAT_SOURCE: ${{ github.workspace }}/.hands-compat-baseline
        run: python -m pytest tests/ -q --tb=short
