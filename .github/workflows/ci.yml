name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  # local_home needs the SDK's local CLI and its integration commands
  # (tenuo-ai/tenuo#970, #976), which aren't released yet. Build them from the
  # branch until they ship, then pin the release here instead.
  local-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package with the matching SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "tenuo @ git+https://github.com/tenuo-ai/tenuo@feat/cli-integrations#subdirectory=tenuo-python"
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
      - name: tenuo-cli routes to this integration
        run: tenuo-cli hermes session --help
