name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored in the repo.
# PyPI side, once: project "hermes-tenuo" -> Publishing -> add GitHub publisher
#   owner tenuo-ai, repo hermes-tenuo, workflow publish.yml, environment pypi.
# Runs when a GitHub release is published, or by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example, v0.1.4)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          assert tag == f"v{version}", f"release tag {tag!r} does not match package version {version!r}"
          print(f"building hermes-tenuo {version} from {tag}")
          PY
      - name: Test release source
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m ruff check
          python -m pytest tests/ -q --tb=short
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check the wheel does not ship the repo-root shim
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          top = {n.split("/")[0] for n in zipfile.ZipFile(whl).namelist()}
          assert top == {"hermes_tenuo", next(t for t in top if t.endswith(".dist-info"))}, top
          print("wheel top-level:", sorted(top))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
