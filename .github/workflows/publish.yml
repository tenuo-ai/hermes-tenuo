name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored in the repo.
# PyPI side, once: project "hermes-tenuo" -> Publishing -> add GitHub publisher
#   owner tenuo-ai, repo hermes-tenuo, workflow publish.yml, environment pypi.
# Runs when a GitHub release is published, or by hand for an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel does not ship the repo-root shim
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          top = {n.split("/")[0] for n in zipfile.ZipFile(whl).namelist()}
          assert top == {"hermes_tenuo", next(t for t in top if t.endswith(".dist-info"))}, top
          print("wheel top-level:", sorted(top))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
