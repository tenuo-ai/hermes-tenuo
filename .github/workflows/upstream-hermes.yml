name: Upstream Hermes

# Loads the plugin through NousResearch/hermes-agent `main` via Hermes's real
# plugin loader, both install routes. Runs nightly so "tested against upstream"
# stays true as Hermes changes; also on PRs that touch this job.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/upstream-hermes.yml"
      - "tests/test_upstream_hermes.py"
      - "__init__.py"
      - "plugin.yaml"
      - "pyproject.toml"
      - "hermes_tenuo/**"

permissions:
  contents: read

jobs:
  load:
    name: ${{ matrix.route }} route
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        route: [entrypoint, directory]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes-agent
      - uses: actions/setup-python@v7
        with:
          # Hermes installs its runtime dependencies only on Python 3.14.
          python-version: "3.14"
      - name: Install Hermes from source
        run: |
          python -m pip install --upgrade pip uv
          # Hermes relies on uv overrides for reviewed security pins such as Pillow 13.
          uv sync --project ./hermes-agent --frozen --no-dev
          hermes-agent/.venv/bin/python -c "import hermes_cli, importlib.metadata as m; print('hermes-agent', m.version('hermes-agent'))"
          hermes-agent/.venv/bin/python -c "import hermes_cli.plugins"
          git -C hermes-agent log -1 --format='upstream %h %ad %s' --date=short
      - name: Install the plugin (entrypoint route)
        if: matrix.route == 'entrypoint'
        run: uv pip install --python hermes-agent/.venv/bin/python . pytest
      - name: Install only tenuo (directory route)
        if: matrix.route == 'directory'
        run: uv pip install --python hermes-agent/.venv/bin/python "tenuo>=0.3.3,<0.4" pytest
      - name: Load through Hermes's plugin loader
        run: hermes-agent/.venv/bin/python -m pytest tests/test_upstream_hermes.py -q -rs --tb=short
