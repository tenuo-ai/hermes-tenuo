# Entry for the Hermes plugin catalog (NousResearch/hermes-agent, plugin-catalog/).
# Submit as a PR adding this file as plugin-catalog/hermes-tenuo.yaml.
# The sha below is a placeholder on purpose: fill it at submission time with
#   git rev-parse <release-tag>
# so this file never drifts from the tag. Their rules: exact 40-hex sha, pinned
# commit at least two weeks old, submitted by the repo owner, capabilities must
# match what register() registers at that commit.
name: hermes-tenuo
title: Tenuo
version: 0.4.0
category: tools
repo: https://github.com/tenuo-ai/hermes-tenuo
sha: "0000000000000000000000000000000000000000"   # placeholder: replace with the selected release commit
description: >-
  Scoped tool permissions and sandboxed local workspaces for Hermes Agent.
  With Hands, connect one conversation
  to a sandboxed folder on your own macOS or Linux machine while keeping Hermes
  memory and skills on the server. Hands works without a manually minted warrant.
  Hands is off until configured; its optional HTTP listener accepts outbound device
  connections. Devices grant a folder and time window locally; internet is off by
  default. Commands and results travel to the Hermes server; use HTTPS or a private
  network. Browser/MCP tools do not move. Unsandboxed and broader-read modes require
  explicit device flags. Authorization decisions are written to a local audit log.
maintainer: tenuo-ai
tier: community
requires_hermes: ">=0.20"
docs_url: https://github.com/tenuo-ai/hermes-tenuo#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - subagent_start
    - pre_llm_call
  provides_middleware: [tool_execution]
  requires_env:
    - TENUO_WARRANT
    - TENUO_SIGNING_KEY
    - TENUO_TRUSTED_ROOT
