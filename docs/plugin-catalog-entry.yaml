# Entry for the Hermes plugin catalog (NousResearch/hermes-agent, plugin-catalog/).
# Submit as a PR adding this file as plugin-catalog/hermes-tenuo.yaml.
# Rules that apply (plugin-catalog/README.md there): exact 40-hex sha, pinned commit
# at least two weeks old, submitted by the repo owner, capabilities must match what
# register() registers at that commit.
name: hermes-tenuo
repo: https://github.com/tenuo-ai/hermes-tenuo
sha: f17cbd175744e5a4c934872633c02f39b4ee6f4f   # v0.1.0 — refresh with `git rev-parse v0.1.0` before submitting
description: Per-call authorization for Hermes tool calls. Each call is checked against a signed, expiring warrant, arguments included, before the handler runs.
maintainer: tenuo-ai
tier: community
requires_hermes: ">=0.20"
docs_url: https://github.com/tenuo-ai/hermes-tenuo#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - subagent_start
  provides_middleware: []
  requires_env:
    - TENUO_WARRANT
    - TENUO_SIGNING_KEY
