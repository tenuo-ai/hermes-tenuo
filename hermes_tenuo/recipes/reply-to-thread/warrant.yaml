# Answer one email thread through Google Workspace MCP, configured in Hermes as
# `google_workspace`. Only that thread, only to that address, for an hour.
#   tenuo-cli hermes session attach --session telegram:YOUR_ID --template warrant.yaml \
#     --set me=you@yourco.com --set thread=18f2a9c0d1e2b3a4 --set to=bob@vendor.com
version: 2
name: reply-to-thread
ttl: 1h
vars:
  me: {description: "your Google account email"}
  thread: {description: "the Gmail thread ID"}
  to: {description: "who the reply may go to, lowercase (a list for several)"}
capabilities:
  mcp__google_workspace__get_gmail_thread_content:
    user_google_email: ${me}
    thread_id: ${thread}
    body_format: {optional: any}
    include_analysis: {optional: any}
  mcp__google_workspace__send_gmail_message:
    user_google_email: ${me}
    thread_id: ${thread}
    to: ${to}
    subject: any
    body: any
    in_reply_to: {optional: any}
    references: {optional: any}
    body_format: {optional: [plain, html]}
