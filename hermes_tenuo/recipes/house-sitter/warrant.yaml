# What your house-sitter may ask Hermes to do, for their stay. Attach it to their
# messaging ID, not a session:
#   tenuo-cli warrant issue --template house-sitter.yaml --holder agent --set stay=7d --out sitter.warrant
#   tenuo-cli hermes session attach --session telegram:THEIR_ID --file sitter.warrant
version: 2
name: house-sitter
ttl: ${stay}
vars:
  stay: {default: 7d, description: "how long they stay, e.g. 10d"}
  readable: {default: [climate.guest_room, light.guest_room, binary_sensor.front_door],
             description: "entities they may read, as a list"}
  controllable: {default: [light.guest_room, scene.guest_room_comfort],
                 description: "entities they may switch on and off, as a list"}
  domains: {default: [light, scene], description: "the domains of those entities"}
capabilities:
  ha_list_entities:
    domain: [light, scene, climate]       # required: without it Hermes lists every domain
  ha_get_state:
    entity_id: ${readable}
  ha_call_service:
    domain: ${domains}
    service: [turn_on, turn_off]
    entity_id: ${controllable}
